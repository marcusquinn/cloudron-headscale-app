name: Publish Cloudron Catalog

# Managed caller. Publication still requires CLOUDRON_PUBLICATION_ENABLED=true;
# PRs only validate and build without publishing. See docs/PUBLISHING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@4366037537f8a9aaf7f738a37465a6b1433dd6d5
    with:
      aidevops_ref: 4366037537f8a9aaf7f738a37465a6b1433dd6d5
      image_repository: ghcr.io/marcusquinn/cloudron-headscale-app
      cli_version: '8.2.6'
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
      package_checks: |
        bash test/package-test.sh
        shellcheck -x start.sh scripts/*.sh test/*.sh
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
