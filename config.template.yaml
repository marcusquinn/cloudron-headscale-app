server_url: "__SERVER_URL__"
listen_addr: "0.0.0.0:8080"
metrics_listen_addr: "127.0.0.1:9090"
grpc_listen_addr: "127.0.0.1:50443"
grpc_allow_insecure: false
noise:
  private_key_path: /app/data/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
database:
  type: sqlite
  sqlite:
    path: /app/data/db.sqlite
    write_ahead_log: true
derp:
  server:
    enabled: __DERP_ENABLED__
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "__STUN_LISTEN_ADDR__"
    private_key_path: /app/data/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
dns:
  magic_dns: true
  base_domain: "headscale.__APP_DOMAIN__"
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
unix_socket: /app/data/headscale.sock
unix_socket_permission: "0770"
log:
  level: info
  format: text
logtail:
  enabled: false
